catalogs:
  build:
    '@vitejs/plugin-vue': ^6.0.6
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vite-plus: 1.0.0
    wrangler: '^4.90.0'
  frontend:
    '@iconify-json/carbon': ^1.2.21
    unocss: ^66.6.8
    vue: ^3.5.34
  types:
    '@types/node': ^24.12.3
    '@vue/tsconfig': ^0.9.1
    typescript: ~5.9.3
  dev:
    taze: ^19.11.0
    jiti: ^2.7.0
    puppeteer: ^24.43.0

onlyBuiltDependencies:
  - esbuild
  - puppeteer
  - sharp
  - workerd

overrides:
  vite@*: catalog:build
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
